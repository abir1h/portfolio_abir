<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Abir Rahman — Flutter Mobile & Web Developer with 4+ years of experience building high-performing apps for education, fleet, and talent marketplaces.">
  <meta name="theme-color" content="#050816">

  <!-- Open Graph -->
  <meta property="og:title" content="Abir Rahman — Flutter Developer Portfolio">
  <meta property="og:description" content="Flutter developer with 4+ years of experience building high-performing, crash-resistant apps. Focused on scalable architecture and delightful UI.">
  <meta property="og:type" content="website">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Abir Rahman">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Abir Rahman — Flutter Developer Portfolio</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #050816;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 100% 0%, rgba(139, 92, 246, 0.08) 0%, transparent 50%);
    }
    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 36px;
    }
    .loader-wrapper {
      position: relative;
      width: 72px;
      height: 72px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .spinner-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: #6366F1;
      border-bottom-color: #8B5CF6;
      animation: spin 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
    }
    .spinner-ring::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-left-color: rgba(99, 102, 241, 0.3);
      border-right-color: rgba(139, 92, 246, 0.3);
      animation: spin 2.5s linear infinite reverse;
    }
    .spinner-core {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #6366F1, #8B5CF6);
      border-radius: 50%;
      animation: pulse-core 2s ease-in-out infinite;
      box-shadow: 0 0 20px rgba(99, 102, 241, 0.6);
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse-core {
      0%, 100% { transform: scale(0.8); opacity: 0.8; box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); }
      50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 30px rgba(139, 92, 246, 0.9); }
    }
    .loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .loading-text {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 6px;
      background: linear-gradient(to right, #ffffff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: pulse-text 2s infinite ease-in-out;
      margin-left: 6px; /* center compensation for letter spacing */
    }
    .loading-subtext {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.4);
    }
    @keyframes pulse-text {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; text-shadow: 0 0 20px rgba(255,255,255,0.2); }
    }
  </style>
</head>
<body>
  <div class="loader-container" id="initial-loader">
    <div class="loader-wrapper">
      <div class="spinner-ring"></div>
      <div class="spinner-core"></div>
    </div>
    <div class="loading-content">
      <div class="loading-text">INITIALIZING</div>
      <div class="loading-subtext">Preparing portfolio experience...</div>
    </div>
  </div>
  <script>
    // Remove the loader gracefully once Flutter is ready
    window.addEventListener("flutter-first-frame", function() {
      var loader = document.getElementById("initial-loader");
      if (loader) {
        loader.style.opacity = "0";
        loader.style.transition = "opacity 0.5s ease";
        setTimeout(function() { loader.remove(); }, 500);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
